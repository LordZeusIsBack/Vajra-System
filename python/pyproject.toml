[project]
name = "vajra-server"
version = "0.1.0"
description = "VAJRA Source Vault — FastAPI ingestion server (PDF → Shamir SSS → IPFS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",   # includes uvicorn + python-multipart
    "pydantic-settings>=2.3.0",
    "cryptography>=42.0.0",         # AES-256-GCM
    "httpx>=0.27.0",                # async kubo HTTP API calls + drand relay calls
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",         # async drand tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false